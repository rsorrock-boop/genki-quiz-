<script type="text/babel">
const POINTS_RAW=[["1a", 1, "XはYです", "X は Y です", "X is Y", "私{わたし}は学生{がくせい}です。", "I am a student."], ["1b", 1, "Question sentences (〜か)", "…か。", "Turns a statement into a question", "メアリーさんはアメリカ人{じん}ですか。", "Is Mary American?"], ["1c", 1, "Noun の Noun", "N1 の N2", "N2 of / belonging to N1", "日本語{にほんご}の先生{せんせい}", "a Japanese-language teacher"], ["1d", 1, "Time (〜時{じ}／〜分{ふん}／〜半{はん})", "〜時{じ}〜分{ふん}／〜時半{じはん}", "telling the time", "今{いま}、三{さん}時半{じはん}です。", "It's 3:30 now."], ["2a", 2, "これ／それ／あれ／どれ", "これ・それ・あれ・どれ", "this one / that one / that one over there / which one", "それは私{わたし}のかばんです。", "That is my bag."], ["2b", 2, "この／その／あの／どの + Noun", "この・その・あの・どの + N", "this N / that N / that N over there / which N", "あの人{ひと}はだれですか。", "Who is that person over there?"], ["2c", 2, "ここ／そこ／あそこ／どこ", "ここ・そこ・あそこ・どこ", "here / there / over there / where", "トイレはどこですか。", "Where is the restroom?"], ["2d", 2, "だれの Noun", "だれの N", "whose N", "これはだれの傘{かさ}ですか。", "Whose umbrella is this?"], ["2e", 2, "Noun も", "N も", "N too / also", "私{わたし}も学生{がくせい}です。", "I'm a student too."], ["2f", 2, "Noun じゃないです", "N じゃないです", "is not N", "私{わたし}は先生{せんせい}じゃないです。", "I'm not a teacher."], ["2g", 2, "〜ね／〜よ", "…ね／…よ", "ね: seeking agreement; よ: telling new info", "おいしいですね。", "It's delicious, isn't it?"], ["3a", 3, "Present tense (ます)", "V-ます／V-ません", "habits and future actions", "明日{あした}、京都{きょうと}に行{い}きます。", "I'll go to Kyoto tomorrow."], ["3b", 3, "Verb particles (で・に・へ・を)", "place で V／place に・へ 行{い}く／N を V", "where an action happens / destination / object", "図書館{としょかん}で本{ほん}を読{よ}みます。", "I read books at the library."], ["3c", 3, "Time references", "time に V", "に with clock times and days; none with 今日・明日・毎日", "土曜日{どようび}に映画{えいが}を見{み}ます。", "I'll watch a movie on Saturday."], ["3d", 3, "〜ませんか", "V-ませんか", "Won't you…? (invitation)", "一緒{いっしょ}に昼{ひる}ご飯{はん}を食{た}べませんか。", "Would you like to have lunch together?"], ["3e", 3, "Frequency adverbs", "よく／時々{ときどき}／あまり〜ません／全然{ぜんぜん}〜ません", "often / sometimes / not much / not at all", "私{わたし}は時々{ときどき}コーヒーを飲{の}みます。", "I sometimes drink coffee."], ["3f", 3, "Topic は", "X は …", "marks the topic you're talking about", "私{わたし}は日曜日{にちようび}にテニスをします。", "As for me, I play tennis on Sundays."], ["4a", 4, "あります／います", "N が あります／います", "there is (things: ある; people/animals: いる)", "あそこに猫{ねこ}がいます。", "There's a cat over there."], ["4b", 4, "Location words", "N の 上{うえ}／下{した}／前{まえ}／後{うし}ろ／中{なか}／となり／間{あいだ}", "on / under / in front of / behind / inside / next to / between", "本{ほん}は机{つくえ}の上{うえ}にあります。", "The book is on the desk."], ["4c", 4, "Past tense of です", "N／な-adj でした・じゃなかったです", "was / was not", "昨日{きのう}は月曜日{げつようび}でした。", "Yesterday was Monday."], ["4d", 4, "Past tense of verbs", "V-ました／V-ませんでした", "did / did not", "週末{しゅうまつ}、友{とも}だちに会{あ}いました。", "I met a friend on the weekend."], ["4e", 4, "も (with particles)", "N にも／N でも／N も", "also, combined with other particles", "月曜日{げつようび}にも火曜日{かようび}にもアルバイトがあります。", "I have work on Monday and also on Tuesday."], ["4f", 4, "〜時間{じかん} (duration)", "〜時間{じかん}", "for … hours", "毎日{まいにち}二{に}時間{じかん}勉強{べんきょう}します。", "I study for two hours every day."], ["4g", 4, "たくさん", "たくさん", "a lot of", "写真{しゃしん}をたくさん撮{と}りました。", "I took a lot of pictures."], ["4h", 4, "と (together with)", "N と", "with N; N and N", "友{とも}だちと買{か}い物{もの}に行{い}きました。", "I went shopping with a friend."], ["5a", 5, "Adjectives (present tense)", "い-adj／な-adj です・じゃないです", "is / is not (adjective)", "この部屋{へや}は静{しず}かです。", "This room is quiet."], ["5b", 5, "Adjectives (past tense)", "い-adj かったです／な-adj でした", "was (adjective)", "旅行{りょこう}は楽{たの}しかったです。", "The trip was fun."], ["5c", 5, "Adjective + Noun", "い-adj N／な-adj な N", "describing a noun", "きれいな花{はな}ですね。", "What a pretty flower."], ["5d", 5, "好{す}き（な）／きらい（な）", "N が好{す}きです／きらいです", "like / dislike N", "私{わたし}は魚{さかな}がきらいです。", "I don't like fish."], ["5e", 5, "〜ましょう", "V-ましょう", "Let's …", "一緒{いっしょ}に行{い}きましょう。", "Let's go together."], ["5f", 5, "Degree expressions", "とても／ちょっと／あまり〜ない／全然{ぜんぜん}〜ない", "very / a little / not very / not at all", "このかばんはあまり高{たか}くないです。", "This bag isn't very expensive."], ["6a", 6, "て-form", "V-て", "connecting form of verbs", "窓{まど}を開{あ}けて、寝{ね}ました。", "I opened the window and went to sleep."], ["6b", 6, "〜てください", "V-てください", "Please do …", "ゆっくり話{はな}してください。", "Please speak slowly."], ["6c", 6, "Describing two activities", "V-て、V", "do A and (then) B", "朝{あさ}ご飯{はん}を食{た}べて、学校{がっこう}に行{い}きます。", "I eat breakfast and go to school."], ["6d", 6, "〜てもいいです", "V-てもいいです(か)", "You may … / May I …?", "ここに座{すわ}ってもいいですか。", "May I sit here?"], ["6e", 6, "〜てはいけません", "V-てはいけません", "You must not …", "ここで写真{しゃしん}を撮{と}ってはいけません。", "You must not take pictures here."], ["6f", 6, "〜から (reason)", "reason から、result", "because …, so …", "時間{じかん}がありませんから、急{いそ}ぎましょう。", "We don't have time, so let's hurry."], ["6g", 6, "〜ましょうか", "V-ましょうか", "Shall I …? (offer)", "荷物{にもつ}を持{も}ちましょうか。", "Shall I carry your luggage?"], ["7a", 7, "〜ている (in progress)", "V-ている", "is doing (right now)", "今{いま}、雨{あめ}が降{ふ}っています。", "It's raining now."], ["7b", 7, "〜ている (resulting state)", "V-ている (結婚{けっこん}する・住{す}む・知{し}る etc.)", "a state resulting from a change", "姉{あね}は東京{とうきょう}に住{す}んでいます。", "My older sister lives in Tokyo."], ["7c", 7, "Describing people", "person は part が adj", "Person has a … (feature)", "ロバートさんは背{せ}が高{たか}いです。", "Robert is tall."], ["7d", 7, "Adjective / noun て-forms", "い-adj くて／な-adj で／N で", "… and … (joining descriptions)", "この店{みせ}は安{やす}くて、おいしいです。", "This place is cheap and good."], ["7e", 7, "Verb stem + に行{い}く／来{く}る／帰{かえ}る", "V-stem に 行{い}く", "go / come / return to do …", "デパートに服{ふく}を買{か}いに行{い}きます。", "I'm going to the department store to buy clothes."], ["7f", 7, "Counting people", "一人{ひとり}・二{に}人{にん}・三{さん}人{にん}…", "one person, two people…", "クラスに学生{がくせい}が十人{じゅうにん}います。", "There are ten students in the class."], ["8a", 8, "Short forms (present)", "V-る／V-ない", "plain present forms", "毎日{まいにち}、日本語{にほんご}を勉強{べんきょう}する。", "I study Japanese every day. (casual)"], ["8b", 8, "Informal speech", "short forms in casual talk", "   f:{n:"Fill in the blank",g:"g",d:"〜から / 〜のに …"},
  p:{n:"Particles",g:"g",d:"は・が・を・に・で"},
  m:{n:"Meaning",g:"g",d:"pattern → English"},
  e:{n:"English → Japanese",g:"g",d:"pick the sentence"},
  r:{n:"Correct sentence",g:"g",d:"spot the right one"},
};
const TYPE_ORDER=["c1","c2","c3","c4","x","f","p","m","e","r"];
const POS_LABEL={"u-v":"う-verb","ru-v":"る-verb","irr-v":"irregular verb","i-adj":"い-adjective","na-adj":"な-adjective"};

const RULE={
  masu:{u:"last sound → い-row + ます",ru:"drop る + ます",irr:"する→します・くる→きます"},
  masen:{u:"い-row + ません",ru:"drop る + ません",irr:"しません・きません"},
  mashita:{u:"い-row + ました",ru:"drop る + ました",irr:"しました・きました"},
  masendeshita:{u:"い-row + ませんでした",ru:"drop る + ませんでした",irr:"しませんでした・きませんでした"},
  mashou:{u:"い-row + ましょう",ru:"drop る + ましょう",irr:"しましょう・きましょう"},
  te:{u:"う・つ・る→って　む・ぶ・ぬ→んで　く→いて　ぐ→いで　す→して　(行く→行って!)",ru:"drop る + て",irr:"する→して・くる→きて"},
  ta:{u:"same as て-form, but て→た / で→だ (行く→行った!)",ru:"drop る + た",irr:"した・きた"},
  nai:{u:"あ-row + ない (う→わない; ある→ない!)",ru:"drop る + ない",irr:"しない・こない"},
  nakatta:{u:"あ-row + なかった (う→わ; ある→なかった!)",ru:"drop る + なかった",irr:"しなかった・こなかった"},
  tai:{u:"い-row (ます stem) + たい",ru:"drop る + たい",irr:"したい・きたい"},
  pot:{u:"え-row + る (書く→書ける)",ru:"drop る + られる",irr:"する→できる・くる→こられる"},
  vol:{u:"お-row + う (帰る→帰ろう)",ru:"drop る + よう",irr:"しよう・こよう"},
  tara:{u:"short past (た) + ら",ru:"drop る + たら",irr:"したら・きたら"},
  pass:{u:"あ-row + れる (う→われる)",ru:"drop る + られる",irr:"される・こられる"},
  ba:{u:"え-row + ば",ru:"drop る + れば",irr:"すれば・くれば"},
  caus:{u:"あ-row + せる (う→わせる)",ru:"drop る + させる",irr:"させる・こさせる"},
  cpass:{u:"あ-row + される (but す-verbs: させられる)",ru:"drop る + させられる",irr:"させられる・こさせられる"},
  a_neg:{i:"い → くないです (いい → よくないです)",na:"+ じゃないです"},
  a_past:{i:"い → かったです (いい → よかったです)",na:"+ でした"},
  a_pastneg:{i:"い → くなかったです (いい → よくなかったです)",na:"+ じゃなかったです"},
  a_te:{i:"い → くて (いい → よくて)",na:"+ で"},
  a_naru:{i:"い → く + なる (いい → よくなる)",na:"+ に + なる"},
  a_sou:{i:"drop い + そう (いい → よさそう)",na:"+ そう"},
  a_ba:{i:"い → ければ (いい → よければ)",na:""},
};

const WORDS=WORDS_RAW.map(w=>({...w,c:vclass(w),al:alignWord(w.k,w.jp),disp:w.k||w.jp,key:(w.k||w.jp)+"/"+w.pos}));
const WORD_BY_KEY=Object.fromEntries(WORDS.map(w=>[w.key,w]));
const POINTS=POINTS_RAW.map(p=>({id:p[0],l:p[1],t:p[2],pat:p[3],mean:p[4],ex:p[5],exEn:p[6]}));
const POINT_BY_ID=Object.fromEntries(POINTS.map(p=>[p.id,p]));

function formsFor(w){
  const c=w.c;
  if(c==="i"||c==="na") return Object.keys(FORMS).filter(f=>FORMS[f].p==="a"||(FORMS[f].p==="i"&&c==="i")).filter(f=>!(f==="a_sou"&&/(かわいい|可愛い)$/.test(w.jp)));
  return Object.keys(FORMS).filter(f=>FORMS[f].p==="v").filter(f=>!(ACTION_FORMS.has(f)&&NO_ACTION.test(w.jp)));
}

// Build all questions once
const ALLQ=[];
WORDS.forEach(w=>{
  const isVerb=["u","ru","irr"].includes(w.c);
  formsFor(w).forEach(f=>{
    const l=Math.max(w.l,FORMS[f].l);
    ALLQ.push({id:`c1|${f}|${w.key}`,ty:"c1",l,w:w.key,f});
    if(!["masen","mashita","masendeshita"].includes(f)) ALLQ.push({id:`c2|${f}|${w.key}`,ty:"c2",l,w:w.key,f});
    if(isVerb&&["masu","te","nai","ta"].includes(f)) ALLQ.push({id:`c4|${f}|${w.key}`,ty:"c4",l,w:w.key,f});
  });
  if(isVerb) ALLQ.push({id:`c3|${w.key}`,ty:"c3",l:Math.max(w.l,3),w:w.key});
});
const GCOUNT={};
GQ_RAW.forEach(q=>{const n=(GCOUNT[q[0]]=(GCOUNT[q[0]]||0)+1);const p=POINT_BY_ID[q[0]];
  ALLQ.push({id:`g|${q[0]}|${n}`,ty:q[1],l:p.l,pid:q[0],q:q[2],en:q[3],a:q[4],d:q.slice(5)});});
const Q_BY_ID=Object.fromEntries(ALLQ.map(q=>[q.id,q]));
const LESSON_NUMS=[...new Set(ALLQ.map(q=>q.l))].sort((a,b)=>a-b);

function pickWrong(correct,cands,n){
  const c=[...new Set(cands)].filter(x=>x&&x!==correct);
  return shuffle(c).slice(0,n);
}
const NOT_SURE={label:"🤷 わからない — Not sure",correct:false,notSure:true};
function finishOpts(correct,wrong){
  const opts=shuffle([{label:correct,correct:true},...wrong.map(x=>({label:x,correct:false}))]);
  opts.push(NOT_SURE);
  return {opts,ans:opts.findIndex(o=>o.correct)};
}

// Turn a question into a card (options shuffled each session)
function makeCard(q){
  if(q.ty==="c1"){const w=WORD_BY_KEY[q.w];const right=conj(w.disp,w.c,q.f);
    const wrong=pickWrong(right,sameEndWrongs(w.disp,w.c,q.f),3);
    const r=finishOpts(right,wrong);r.opts.forEach(o=>{if(!o.notSure)o.label=markFor(w,o.label);});return r;}
  if(q.ty==="c2"){const w=WORD_BY_KEY[q.w];const shown=conj(w.disp,w.c,q.f);
    const IF=["tara","ba","a_ba"];
    const keepIf=IF.includes(q.f)?null:shuffle(IF)[0];
    const all=formsFor(w).filter(g=>g!==q.f&&conj(w.disp,w.c,g)!==shown&&!["masen","mashita","masendeshita"].includes(g)&&!(IF.includes(g)&&g!==keepIf));
    const near=all.filter(g=>FORMS[g].l<=Math.max(q.l,9));
    const wrong=pickWrong(FORMS[q.f].q,(near.length>=3?near:all).map(g=>FORMS[g].q),3);
    return finishOpts(FORMS[q.f].q,wrong);}
  if(q.ty==="c3"){const w=WORD_BY_KEY[q.w];const right=POS_LABEL[w.pos];
    const opts=[{label:"る-verb",correct:w.pos==="ru-v"},{label:"う-verb",correct:w.pos==="u-v"},{label:"irregular verb",correct:w.pos==="irr-v"}];
    opts.push(NOT_SURE);return {opts,ans:opts.findIndex(o=>o.correct)};}
  if(q.ty==="c4"){const w=WORD_BY_KEY[q.w];const shown=conj(w.disp,w.c,q.f);
    let cands=dictCandidates(shown,q.f);
    const st=w.disp.slice(0,-1);["る","う","く","す","つ","む"].forEach(e=>cands.push(st+e));
    const wrong=pickWrong(w.disp,cands,3);
    const r=finishOpts(w.disp,wrong);r.opts.forEach(o=>{if(!o.notSure)o.label=markFor(w,o.label);});return r;}
  // grammar question
  return finishOpts(q.a,q.d);
}

function describe(q){ // short label for logs
  if(q.ty.startsWith("c")){const w=WORD_BY_KEY[q.w];if(!w)return {main:"?",sub:""};
    if(q.ty==="c3")return {main:w.disp,sub:`Verb type · ${POS_LABEL[w.pos]}`};
    return {main:w.disp,sub:`${TYPE_INFO[q.ty].n} · ${FORMS[q.f].n}`};}
  const p=POINT_BY_ID[q.pid];return {main:q.q||q.en,sub:`${TYPE_INFO[q.ty].n} · ${p?p.t:""}`};
}

function buildDeck(pool,globalLog){
  return pool.map(q=>{
    const e=globalLog[q.id];
    let status="unseen";
    if(e?.totalWrongs>0)status="redemption";else if(e?.mastered)status="inPool";
    const card=makeCard(q);
    return {qid:q.id,status,opts:card.opts,ans:card.ans,
      wrongCount:status==="redemption"?(e?.totalWrongs||1):0,
      streakNeeded:status==="redemption"?(e?.totalWrongs||1):0,streakCurrent:0};
  });
}
function pickNext(deck,lastQid){
  const el=deck.map((c,i)=>({c,i})).filter(({c})=>c.status!=="mastered"&&c.status!=="deferred");
  if(!el.length)return -1;
  const w=el.map(({c})=>c.status==="redemption"?50:c.status==="unseen"?20:5);
  const li=el.findIndex(({c})=>c.qid===lastQid);if(li!==-1&&el.length>1)w[li]=0;
  return el[weightedPick(w)].i;
}
function processAnswer(deck,idx,correct){
  return deck.map((c,i)=>{if(i!==idx)return c;const card={...c};
    if(correct){if(card.status==="redemption"){card.streakCurrent++;if(card.streakCurrent>=card.streakNeeded){card.status="mastered";card.wrongCount=0;card.streakCurrent=0;card.streakNeeded=0;}}else card.status="mastered";}
    else{card.wrongCount++;card.streakNeeded=card.wrongCount;card.streakCurrent=0;card.status="deferred";}
    return card;});
}
// balanced sample across question types
function sampleBalanced(pool,n){
  const by={};shuffle(pool).forEach(q=>{(by[q.ty]=by[q.ty]||[]).push(q);});
  const keys=shuffle(Object.keys(by));const out=[];
  while(out.length<n&&keys.some(k=>by[k].length)){for(const k of keys){if(by[k].length&&out.length<n)out.push(by[k].pop());}}
  return shuffle(out);
}

// ════════════════ UI helpers ════════════════
const { useState, useEffect, useCallback, useRef, useMemo } = React;
const STORAGE_KEY="genki-bunpou-srs-v1";
const SETTINGS_KEY="genki-bunpou-settings-v1";

function Ruby({s,furi,className,style}){
  if(s==null)return null;
  const parts=[];const re=/([一-鿿々〆ヶ]+)\{([^}]+)\}|＿＿/g;let last=0,m,i=0;
  while((m=re.exec(s))){
    if(m.index>last)parts.push(s.slice(last,m.index));
    if(m[0]==="＿＿")parts.push(<span key={i++} className="blank">　　</span>);
    else parts.push(furi?<ruby key={i++}>{m[1]}<rt>{m[2]}</rt></ruby>:m[1]);
    last=re.lastIndex;
  }
  if(last<s.length)parts.push(s.slice(last));
  return <span className={className} style={style}>{parts}</span>;
}
const plain=s=>(s||"").replace(/\{[^}]+\}/g,"");

function Explain({q,card,chosen,furi}){
  const ok=chosen===card.ans;
  if(q.ty.startsWith("c")){
    const w=WORD_BY_KEY[q.w];
    const head=<><Ruby s={markFor(w,w.disp)} furi={furi}/> <span className="muted">（{w.jp}）· {POS_LABEL[w.pos]} · {w.m}</span></>;
    if(q.ty==="c3"){
      const exc=w.pos==="u-v"&&/[いきしちにひみりぎじびぴえけせてねへめれげぜべぺ]る$/.test(w.jp);
      return <div className="hint">{head}<div className="hint-rule">
        {w.pos==="irr-v"?"Irregular: する and くる (and verbs ending in them) are the only irregular verbs.":
         w.pos==="ru-v"?"る-verb: ends in -iる / -eる and just drops る when conjugating.":
         exc?"⚠️ Exception! Looks like a る-verb (-iる/-eる) but it's an う-verb. Others: 帰る・入る・知る・切る・要る・走る.":
         "う-verb: conjugates by changing its last sound (う-row)."}</div></div>;
    }
    const rule=RULE[q.f]?.[w.c==="irr"?"irr":w.c]||"";
    const target=conj(w.disp,w.c,q.f);
    if(q.ty==="c4") return <div className="hint">{head}<div className="hint-rule"><Ruby s={markFor(w,target)} furi={furi}/> is the {FORMS[q.f].n} of <strong><Ruby s={markFor(w,w.disp)} furi={furi}/></strong>. Rule: {rule}</div></div>;
    return <div className="hint">{head}<div className="hint-rule">{FORMS[q.f].n}: <strong><Ruby s={markFor(w,target)} furi={furi}/></strong>{rule&&<> — {rule}</>}</div></div>;
  }
  const p=POINT_BY_ID[q.pid];
  const full=(q.ty==="f"||q.ty==="p"||q.ty==="x")?q.q.replace("＿＿",q.a):null;
  return <div className="hint">
    {full&&<div className="hint-full"><Ruby s={full} furi={furi}/></div>}
    {q.ty==="r"&&<div className="hint-full"><Ruby s={q.a} furi={furi}/></div>}
    {q.en&&<div className="hint-en">“{q.en}”</div>}
    {q.ty==="m"&&<div className="hint-en">= {q.a}</div>}
    <div className="hint-rule">📘 <strong>{p.t}</strong> · <Ruby s={p.pat} furi={furi}/> — {p.mean}</div>
    <div className="hint-ex"><Ruby s={p.ex} furi={furi}/> <span className="muted">{p.exEn}</span></div>
  </div>;
}

function Prompt({q,furi}){
  if(q.ty==="c1"){const w=WORD_BY_KEY[q.w];return <>
    <div className="bigjp"><Ruby s={markFor(w,w.disp)} furi={furi}/></div>
    <div className="sub">{w.m}</div>
    <div className="ask">→ <strong>{FORMS[q.f].q}</strong></div></>;}
  if(q.ty==="c2"){const w=WORD_BY_KEY[q.w];return <>
    <div className="bigjp"><Ruby s={markFor(w,conj(w.disp,w.c,q.f))} furi={furi}/></div>
    <div className="sub">from <Ruby s={markFor(w,w.disp)} furi={furi}/> · {w.m}</div>
    <div className="ask">Which form is this?</div></>;}
  if(q.ty==="c3"){const w=WORD_BY_KEY[q.w];return <>
    <div className="bigjp"><Ruby s={markFor(w,w.disp)} furi={furi}/></div>
    <div className="sub">{furi?"":`${w.jp} · `}{w.m}</div>
    <div className="ask">What type of verb is this?</div></>;}
  if(q.ty==="c4"){const w=WORD_BY_KEY[q.w];return <>
    <div className="bigjp"><Ruby s={markFor(w,conj(w.disp,w.c,q.f))} furi={furi}/></div>
    <div className="sub">{FORMS[q.f].q}</div>
    <div className="ask">What is the dictionary form?</div></>;}
  if(q.ty==="m")return <><div className="sentence"><Ruby s={q.q} furi={furi}/></div><div className="ask">What does this mean?</div></>;
  if(q.ty==="e")return <><div className="en-big">“{q.en}”</div><div className="ask">Which Japanese means this?</div></>;
  if(q.ty==="r")return <><div className="en-big">“{q.en}”</div><div className="ask">Which sentence is correct?</div></>;
  return <><div className="sentence"><Ruby s={q.q} furi={furi}/></div>{q.en&&<div className="sub">“{q.en}”</div>}<div className="ask">{q.ty==="p"?"Which particle fits?":q.ty==="x"?"Which verb fits?":"Fill in the blank"}</div></>;
}

function loadSettings(){try{const v=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"null");if(v)return v;}catch{}return null;}

function GenkiBunpou(){
  const saved=loadSettings();
  const [lessons,setLessons]=useState(saved?.lessons||[]);
  const [types,setTypes]=useState(saved?.types||TYPE_ORDER);
  const [furi,setFuri]=useState(saved?.furi??true);
  const [phase,setPhase]=useState("start");
  const [pool,setPool]=useState([]);
  const [deck,setDeck]=useState([]);
  const [cardIdx,setCardIdx]=useState(0);
  const [chosen,setChosen]=useState(null);
  const [sessionLog,setSessionLog]=useState([]);
  const [totalCorrect,setTotalCorrect]=useState(0);
  const [totalAnswered,setTotalAnswered]=useState(0);
  const lastQidRef=useRef(null);
  const [globalLog,setGlobalLog]=useState({});
  const [storageReady,setStorageReady]=useState(false);
  const [listFocus,setListFocus]=useState(null);

  useEffect(()=>{try{const v=localStorage.getItem(STORAGE_KEY);if(v)setGlobalLog(JSON.parse(v));}catch{}setStorageReady(true);},[]);
  useEffect(()=>{if(!storageReady)return;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(globalLog));}catch{}},[globalLog,storageReady]);
  useEffect(()=>{try{localStorage.setItem(SETTINGS_KEY,JSON.stringify({lessons,types,furi}));}catch{}},[lessons,types,furi]);
  useEffect(()=>{window.scrollTo(0,0);},[phase]);

  const updateLog=useCallback((qid,correct)=>{
    setGlobalLog(p=>({...p,[qid]:{totalWrongs:(p[qid]?.totalWrongs||0)+(correct?0:1),totalAttempts:(p[qid]?.totalAttempts||0)+1,lastSeen:Date.now(),mastered:!!correct}}));
  },[]);
  const clearLog=useCallback(()=>{if(window.confirm("Clear all grammar progress?")){setGlobalLog({});try{localStorage.removeItem(STORAGE_KEY);}catch{}}},[]);

  const filtered=useMemo(()=>{
    const ls=new Set(lessons),ts=new Set(types);
    return ALLQ.filter(q=>ts.has(q.ty)&&(ls.size===0||ls.has(q.l)));
  },[lessons,types]);

  const weakIds=useMemo(()=>Object.entries(globalLog).filter(([id,v])=>v.totalWrongs>0&&Q_BY_ID[id]).sort((a,b)=>b[1].totalWrongs-a[1].totalWrongs),[globalLog]);

  const startWith=useCallback((qs)=>{
    if(!qs.length)return;
    const sp=qs.slice(0,30);const nd=buildDeck(sp,globalLog);
    setPool(sp);setDeck(nd);setCardIdx(pickNext(nd,null));
    setChosen(null);setSessionLog([]);setTotalCorrect(0);setTotalAnswered(0);lastQidRef.current=null;setPhase("quiz");
  },[globalLog]);
  const startSession=useCallback((weakOnly=false)=>{
    if(weakOnly)return startWith(shuffle(weakIds.map(([id])=>Q_BY_ID[id])));
    startWith(sampleBalanced(filtered,30));
  },[filtered,weakIds,startWith]);
  const practicePoint=useCallback(pid=>startWith(shuffle(ALLQ.filter(q=>q.pid===pid))),[startWith]);

  const pick=useCallback(i=>{
    if(chosen!==null||cardIdx<0)return;
    const card=deck[cardIdx],q=pool[cardIdx],correct=i===card.ans;
    setChosen(i);setTotalAnswered(a=>a+1);if(correct)setTotalCorrect(c=>c+1);
    updateLog(q.id,correct);setDeck(processAnswer(deck,cardIdx,correct));
    setSessionLog(l=>[...l,{q,ok:correct}]);
  },[chosen,cardIdx,pool,deck,updateLog]);
  const next=useCallback(()=>{
    lastQidRef.current=pool[cardIdx]?.id??null;
    const ni=pickNext(deck,lastQidRef.current);
    if(ni===-1){setPhase("complete");return;}
    setCardIdx(ni);setChosen(null);window.scrollTo(0,0);
  },[cardIdx,deck,pool]);

  const cQ=pool[cardIdx],cC=deck[cardIdx];
  const masteredCount=deck.filter(c=>c.status==="mastered").length;
  const deferredCount=deck.filter(c=>c.status==="deferred").length;
  const redemptionCount=deck.filter(c=>c.status==="redemption").length;
  const unseenCount=deck.filter(c=>c.status==="unseen").length;
  const pct=totalAnswered>0?Math.round(totalCorrect/totalAnswered*100):0;
  const ringColor=pct>=80?"#4ade80":pct>=55?"#facc15":"#f87171";
  const seenCount=Object.values(globalLog).filter(v=>v.totalAttempts>0).length;
  const toggleType=t=>setTypes(p=>p.includes(t)?(p.length>1?p.filter(x=>x!==t):p):[...p,t]);

  return (
    <div style={{minHeight:"100vh",background:"#0f0e17",color:"#fffffe",fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif"}}>
      <style>{CSS_CONTENT}</style>
      <div className="wrap">
        <div className="topbar">
          <div className="logo" onClick={()=>setPhase("start")}>Genki 文法 · SRS</div>
          <div style={{display:"flex",gap:8}}>
            <button className="ghost-btn" style={{padding:"8px 12px",fontSize:".8rem"}} onClick={()=>{setListFocus(null);setPhase("list");}}>📘 Grammar</button>
            <button className="ghost-btn" style={{padding:"8px 12px",fontSize:".8rem"}} onClick={()=>setPhase("log")}>{weakIds.length>0?`⚠️ ${weakIds.length}`:"📊 Log"}</button>
          </div>
        </div>

        {phase==="start"&&(<>
          <div className="slabel">Lessons</div>
          <div className="cscroll">
            <button className={`cbtn ${lessons.length===0?"on":""}`} onClick={()=>setLessons([])}>All</button>
            {LESSON_NUMS.map(n=>(<button key={n} className={`cbtn ${lessons.includes(n)?"on":""}`} onClick={()=>setLessons(p=>p.includes(n)?p.filter(x=>x!==n):[...p,n])}>L{n}</button>))}
          </div>
          <div className="slabel">Conjugation questions</div>
          <div className="typegrid">
            {TYPE_ORDER.filter(t=>TYPE_INFO[t].g==="c").map(t=>(<button key={t} className={`tbtn ${types.includes(t)?"on":""}`} onClick={()=>toggleType(t)}><span>{types.includes(t)?"✓ ":""}{TYPE_INFO[t].n}</span><small>{TYPE_INFO[t].d}</small></button>))}
          </div>
          <div className="slabel">Grammar questions</div>
          <div className="typegrid">
            {TYPE_ORDER.filter(t=>TYPE_INFO[t].g==="g").map(t=>(<button key={t} className={`tbtn ${types.includes(t)?"on":""}`} onClick={()=>toggleType(t)}><span>{types.includes(t)?"✓ ":""}{TYPE_INFO[t].n}</span><small>{TYPE_INFO[t].d}</small></button>))}
          </div>
          <div className="card" style={{textAlign:"center",padding:"28px 20px",marginTop:6}}>
            <div style={{fontSize:"2.6rem",marginBottom:8}}>文法</div>
            <p style={{color:"rgba(255,255,255,0.45)",fontSize:".9rem",lineHeight:1.8,marginBottom:14}}>
              {filtered.length} questions{lessons.length>0?` · L${lessons.slice().sort((a,b)=>a-b).join(", L")}`:""} · up to 30 per session
            </p>
            <div className="toggles">
              <button onClick={()=>setFuri(f=>!f)} className={`tog ${furi?"on":""}`}>{furi?"✓ ":""}ふりがな</button>
            </div>
            <div className="btnrow">
              <button className="start-btn" disabled={!filtered.length} onClick={()=>startSession(false)}>スタート START →</button>
              {weakIds.length>0&&<button className="ghost-btn" onClick={()=>startSession(true)}>⚠️ Weak Only</button>}
            </div>
            {filtered.length===0&&<p className="muted" style={{marginTop:12}}>No questions for this mix. Try more lessons or types.</p>}
            {seenCount>0&&(<div style={{marginTop:18,display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
              <span className="chip chip-green">{seenCount} questions seen</span>
              <span className="chip chip-red">{weakIds.length} with mistakes</span>
            </div>)}
          </div>
        </>)}

        {phase==="quiz"&&cQ&&cC&&(<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
            <span style={{fontSize:".72rem",color:"rgba(255,255,255,0.35)",fontFamily:"JetBrains Mono,monospace"}}>{masteredCount}/{deck.length} mastered{deferredCount>0?` · ${deferredCount} deferred`:""}</span>
            <div style={{display:"flex",gap:7,alignItems:"center"}}>
              {redemptionCount>0&&<span className="chip chip-red">🔁 {redemptionCount}</span>}
              {unseenCount>0&&<span className="chip chip-gray">{unseenCount} new</span>}
            </div>
          </div>
          <div className="pbar"><div className="pfill" style={{width:`${deck.length?((masteredCount+deferredCount)/deck.length)*100:0}%`}}/></div>
          <div className="card">
            <div style={{display:"flex",gap:7,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
              <span className={`chip ${TYPE_INFO[cQ.ty].g==="c"?"chip-yellow":"chip-blue"}`}>{TYPE_INFO[cQ.ty].n}</span>
              <span className="chip chip-gray">L{cQ.l}</span>
              {cQ.pid&&<span className="chip chip-purple">{POINT_BY_ID[cQ.pid].t}</span>}
              {cC.status==="redemption"&&<span className="chip chip-red">🔁 need {cC.streakNeeded-cC.streakCurrent} ✓</span>}
              {cC.status==="unseen"&&<span className="chip chip-gray">✨ New</span>}
            </div>
            <Prompt q={cQ} furi={furi}/>
            {cC.opts.map((opt,i)=>{
              let cls="";if(chosen!==null){cls=i===cC.ans?"correct":i===chosen?"wrong":"dim";}
              return(<button key={i} className={`opt ${cls} ${opt.notSure?"notsure":""}`} onClick={()=>pick(i)} disabled={chosen!==null}>
                <span className="lbl">{opt.notSure?"?":"abcd"[i]}</span>
                <span className="optl">{opt.notSure?opt.label:<Ruby s={opt.label} furi={furi}/>}</span>
                {chosen!==null&&i===cC.ans&&<span style={{marginLeft:"auto"}}>✓</span>}
                {chosen!==null&&i===chosen&&i!==cC.ans&&<span style={{marginLeft:"auto"}}>✗</span>}
              </button>);
            })}
            {chosen!==null&&(<>
              <Explain q={cQ} card={cC} chosen={chosen} furi={furi}/>
              {chosen!==cC.ans&&(<div style={{fontSize:".8rem",color:"rgba(255,255,255,0.45)",marginBottom:4}}>
                Deferred — need {deck[cardIdx].wrongCount} consecutive ✓ to redeem
                <div className="streak-dots">{Array.from({length:deck[cardIdx].wrongCount}).map((_,i)=><div key={i} className="dot dot-needed"/>)}</div></div>)}
              {chosen===cC.ans&&cC.status==="redemption"&&deck[cardIdx]?.streakCurrent>0&&(<div style={{fontSize:".8rem",color:"#4ade80",marginBottom:4}}>
                Streak: {deck[cardIdx].streakCurrent}/{deck[cardIdx].streakNeeded} ✓
                <div className="streak-dots">{Array.from({length:deck[cardIdx].streakNeeded}).map((_,i)=><div key={i} className={`dot ${i<deck[cardIdx].streakCurrent?"dot-filled":"dot-empty"}`}/>)}</div></div>)}
            </>)}
          </div>
          {chosen!==null&&(<div style={{marginBottom:6}}><button className="next-btn" onClick={next}>
            {redemptionCount===0&&unseenCount===0&&(masteredCount+deferredCount)===deck.length?"完了 Done 🎉":"次へ Next →"}</button></div>)}
          <button className="ghost-btn" style={{width:"100%",marginTop:10}} onClick={()=>setPhase(totalAnswered>0?"complete":"start")}>End session</button>
        </>)}

        {phase==="complete"&&(<>
          <div className="card" style={{textAlign:"center",padding:"32px 20px"}}>
            <div className="rring" style={{borderColor:ringColor,color:ringColor}}>
              <span style={{fontSize:"1.7rem",fontFamily:"JetBrains Mono,monospace",fontWeight:700}}>{pct}%</span>
              <span style={{fontSize:".68rem",color:"rgba(255,255,255,0.35)",marginTop:1}}>{totalCorrect}/{totalAnswered}</span>
            </div>
            <h2 style={{fontFamily:"'Syne',sans-serif",fontSize:"1.35rem",fontWeight:700,marginBottom:6}}>{pct>=90?"完璧！Perfect!":pct>=70?"よくできました！Great!":"もっと練習！Keep going!"}</h2>
          </div>
          {sessionLog.filter(e=>!e.ok).length>0&&(<div className="card" style={{background:"rgba(248,113,113,0.04)",border:"1px solid rgba(248,113,113,0.12)"}}>
            <div className="slabel">Deferred this session</div>
            {[...new Map(sessionLog.filter(e=>!e.ok).map(e=>[e.q.id,e])).values()].map((e,i)=>{const d=describe(e.q);return(
              <div key={i} className="mrow"><div style={{flex:1,minWidth:0}}><div className="mmain"><Ruby s={d.main} furi={furi}/></div><div className="muted" style={{fontSize:".75rem"}}>{d.sub}</div></div></div>);})}
          </div>)}
          <div className="btnrow">
            <button className="start-btn" onClick={()=>startSession(false)}>もう一度</button>
            {weakIds.length>0&&<button className="ghost-btn" onClick={()=>startSession(true)}>⚠️ Weak Only</button>}
            <button className="ghost-btn" onClick={()=>setPhase("start")}>← Back</button>
          </div>
        </>)}

        {phase==="log"&&(<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div><div className="h2">📊 Mistake Log</div><div className="muted" style={{fontSize:".76rem",marginTop:3}}>{Object.values(globalLog).reduce((a,v)=>a+v.totalAttempts,0)} total attempts</div></div>
            {weakIds.length>0&&<button className="danger-btn" onClick={clearLog}>Clear all</button>}
          </div>
          {weakIds.length===0?(<div className="card" style={{textAlign:"center",padding:"36px",color:"rgba(255,255,255,0.35)"}}><div style={{fontSize:"2rem",marginBottom:10}}>🎉</div>No mistakes yet!</div>):(<>
            <div className="btnrow" style={{marginBottom:14}}>
              <button className="start-btn" onClick={()=>startSession(true)}>Quiz Weak ({Math.min(weakIds.length,30)})</button>
              <button className="ghost-btn" onClick={()=>setPhase("start")}>← Back</button>
            </div>
            <div className="card" style={{padding:16}}>
              <div className="slabel">Sorted by mistakes</div>
              {weakIds.slice(0,80).map(([id,data])=>{const d=describe(Q_BY_ID[id]);const acc=Math.round((data.totalAttempts-data.totalWrongs)/data.totalAttempts*100);return(
                <div key={id} className="mrow"><div style={{flex:1,minWidth:0}}>
                  <div className="mmain"><Ruby s={d.main} furi={furi}/></div>
                  <div className="muted" style={{fontSize:".75rem"}}>{d.sub} · {data.totalAttempts} attempts · {acc}%</div></div>
                  <span className="xbadge">✗ {data.totalWrongs}</span></div>);})}
            </div></>)}
          {weakIds.length===0&&<button className="ghost-btn" style={{width:"100%"}} onClick={()=>setPhase("start")}>← Back</button>}
        </>)}

        {phase==="list"&&<GrammarList globalLog={globalLog} furi={furi} onBack={()=>setPhase("start")} onPractice={practicePoint}/>}
      </div>
    </div>
  );
}

function GrammarList({globalLog,furi,onBack,onPractice}){
  const [searchRaw,setSearchRaw]=useState("");const [search,setSearch]=useState("");
  const [lessonF,setLessonF]=useState([]);
  useEffect(()=>{const t=setTimeout(()=>setSearch(searchRaw),200);return()=>clearTimeout(t);},[searchRaw]);
  const stats=useMemo(()=>{const s={};for(const [id,v] of Object.entries(globalLog)){const q=Q_BY_ID[id];if(!q?.pid)continue;const o=(s[q.pid]=s[q.pid]||{a:0,w:0});o.a+=v.totalAttempts;o.w+=v.totalWrongs;}return s;},[globalLog]);
  const list=useMemo(()=>{const t=search.toLowerCase();const ls=new Set(lessonF);
    return POINTS.filter(p=>(ls.size===0||ls.has(p.l))&&(!t||plain(p.t).toLowerCase().includes(t)||plain(p.pat).toLowerCase().includes(t)||p.mean.toLowerCase().includes(t)||plain(p.ex).includes(t)||p.exEn.toLowerCase().includes(t)));},[search,lessonF]);
  return(<>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div><div className="h2">📘 Grammar List</div><div className="muted" style={{fontSize:".74rem",marginTop:3}}>{POINTS.length} grammar points · Genki L1–L23</div></div>
      <button className="ghost-btn" style={{padding:"8px 14px",fontSize:".8rem"}} onClick={onBack}>← Back</button>
    </div>
    <input type="text" placeholder="Search grammar, e.g. てもいい, because…" value={searchRaw} onChange={e=>setSearchRaw(e.target.value)}
      style={{width:"100%",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,padding:"12px 14px",color:"#fff",fontSize:16,marginBottom:10}}/>
    <div className="cscroll" style={{marginBottom:8}}>
      <button className={`cbtn ${lessonF.length===0?"on":""}`} onClick={()=>setLessonF([])}>All</button>
      {LESSON_NUMS.map(n=>(<button key={n} className={`cbtn ${lessonF.includes(n)?"on":""}`} onClick={()=>setLessonF(p=>p.includes(n)?p.filter(x=>x!==n):[...p,n])}>L{n}</button>))}
    </div>
    <div className="muted" style={{fontSize:".72rem",marginBottom:10,fontFamily:"JetBrains Mono,monospace"}}>{list.length} points</div>
    {list.map(p=>{const s=stats[p.id];return(
      <div key={p.id} className="gcard">
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:6}}>
          <span className="chip chip-gray">L{p.l}</span>
          <span className="gtitle"><Ruby s={p.t} furi={furi}/></span>
          {s&&<span className={`chip ${s.w>0?"chip-red":"chip-green"}`} style={{marginLeft:"auto"}}>{s.w>0?`✗${s.w}`:"✓"} · {s.a}</span>}
        </div>
        <div className="gpat"><Ruby s={p.pat} furi={furi}/></div>
        <div className="gmean">{p.mean}</div>
        <div className="gex"><Ruby s={p.ex} furi={furi}/></div>
        <div className="muted" style={{fontSize:".8rem",marginBottom:10}}>{p.exEn}</div>
        <button className="ghost-btn" style={{width:"100%"}} onClick={()=>onPractice(p.id)}>Practice this point →</button>
      </div>);})}
    {list.length===0&&<div className="muted" style={{textAlign:"center",padding:"40px 0"}}>No grammar matches</div>}
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<GenkiBunpou/>);

</script>
</body>
</html>
